services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://db:27017/fiap-question-form?replicaSet=rs0&directConnection=true
    ports:
      - 3000:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mongo:8.0
    container_name: mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - fiap-question-form-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval "try { const config = rs.conf(); if (config.members[0].host != ''db:27017'') { config.members[0].host = ''db:27017''; rs.reconfig(config, { force: true }); } rs.status().ok } catch (error) { rs.initiate({ _id: ''rs0'', members: [{ _id: 0, host: ''db:27017'' }] }).ok }" | grep 1',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

volumes:
  fiap-question-form-data: